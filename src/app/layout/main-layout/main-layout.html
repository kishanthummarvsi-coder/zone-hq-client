<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar" [class.collapsed]="!isExpanded">
    <app-sidebar
      [isExpanded]="isExpanded"
      (toggle)="toggleSidebar()">
    </app-sidebar>
  </aside>

  <!-- Main Area -->
  <div class="main">

    <app-header (toggle)="toggleSidebar()"></app-header>

    <div class="content">
      <router-outlet></router-outlet>
    </div>

    <app-footer></app-footer>

  </div>

</div>
