<div class="table-container">

    <div class="table-wrapper">
        <mat-card class="table-card">
            <table mat-table [dataSource]="data" matSort>

                <ng-container *ngFor="let column of columns" [matColumnDef]="column.key">

                    <th mat-header-cell *matHeaderCellDef [mat-sort-header]="column.sortable ? column.key : ''"
                        [disabled]="!column.sortable">
                        {{ column.label }}
                    </th>

                    <td mat-cell *matCellDef="let element">
                        {{ element[column.key] }}
                    </td>

                </ng-container>

                <ng-container matColumnDef="actions" *ngIf="showActions">
                    <th mat-header-cell *matHeaderCellDef> Actions </th>
                    <td mat-cell *matCellDef="let element">
                        <button mat-icon-button (click)="edit.emit(element)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button color="warn" (click)="delete.emit(element)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            </table>
        </mat-card>
    </div>
</div>
