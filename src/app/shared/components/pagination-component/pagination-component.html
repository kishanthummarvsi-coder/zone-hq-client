<div class="pagination-wrapper">

    <mat-card class="pagination-card" *ngIf="totalCount > 0">
        <div class="nav-section">

            <button mat-icon-button (click)="prev()" [disabled]="paginationService.pageNumber === 1">
                <mat-icon>chevron_left</mat-icon>
            </button>

            <div class="page-display">
                <span class="current-page">
                    {{ paginationService.pageNumber }}
                </span>
                <span class="divider">/</span>
                <span class="total-pages">
                    {{ totalPages }}
                </span>
            </div>

            <button mat-icon-button (click)="next()" [disabled]="paginationService.pageNumber === totalPages">
                <mat-icon>chevron_right</mat-icon>
            </button>
        </div>

        <div class="control-section">

            <mat-form-field appearance="fill" class="size-field">
                <mat-select [value]="paginationService.pageSize" (selectionChange)="changePageSize($event.value)">
                    <mat-option *ngFor="let size of [5,10,20,50,100]" [value]="size">
                        {{ size }}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="fill" class="goto-field">
                <input matInput #gotoInput type="number" min="1" [max]="totalPages" placeholder="Go"
                    (keyup.enter)="goToPage(+gotoInput.value)">
            </mat-form-field>

            <button mat-icon-button color="primary" (click)="goToPage(+gotoInput.value)">
                <mat-icon>arrow_forward</mat-icon>
            </button>

        </div>

    </mat-card>
</div>
