<app-dynamic-table
  [columns]="columns"
  [data]="users"
  [loading]="loading"
  [showActions]="true"
  (sortChange)="onSortChange($event)"
  (edit)="onEdit($event)"
  (delete)="onDelete($event)">
</app-dynamic-table>

<app-pagination-component
  [totalCount]="totalCount">
</app-pagination-component>
